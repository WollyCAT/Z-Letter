<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Cats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar card">
        <div class="brand">
          <div class="logo-cat" aria-hidden="true">🐱</div>
          <div>
            <h1>Language Cats</h1>
            <p>LLM-powered grammar checking and tone revision</p>
          </div>
        </div>
        <button id="darkModeBtn" class="cat-btn" type="button">🌙 Dark Mode</button>
      </header>

      <section class="card settings">
        <h2>API Settings</h2>
        <div class="grid two-col">
          <label>Provider
            <select id="providerSelect"></select>
          </label>
          <label>Model
            <select id="modelSelect"></select>
          </label>
        </div>
        <label>API Key
          <input id="apiKeyInput" type="password" placeholder="Paste your API key here" />
        </label>
        <label>Language
          <select id="languageSelect">
            <option value="English">English</option>
            <option value="Japanese">Japanese</option>
            <option value="Chinese (Traditional)">Chinese (Traditional)</option>
          </select>
        </label>
      </section>

      <section class="card">
        <h2>Grammar Check</h2>
        <textarea id="grammarInput" rows="8" placeholder="Type or paste English/Japanese text here..."></textarea>
        <div class="actions">
          <button id="checkBtn" class="cat-btn" type="button">🐾 Check Grammar</button>
          <button id="copyBtn" type="button">Copy Revised Text</button>
        </div>
        <p id="statusText" class="status">Ready.</p>
        <div id="highlightOutput" class="highlight-output"></div>
        <div id="issuesList" class="issues"></div>
      </section>

      <section class="card">
        <h2>Tone Revision</h2>
        <textarea id="toneInput" rows="6" placeholder="Type text for tone revision..."></textarea>
        <div class="grid two-col">
          <label>Tone
            <select id="toneSelect">
              <option>Formal</option>
              <option>Casual</option>
              <option>Harsh</option>
              <option>Friendly</option>
              <option>Professional</option>
              <option>Persuasive</option>
            </select>
          </label>
          <label>&nbsp;
            <button id="reviseToneBtn" class="cat-btn" type="button">😺 Revise Tone</button>
          </label>
        </div>
        <label>Revised Output
          <textarea id="toneOutput" rows="6" readonly></textarea>
        </label>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
